<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6d28d9" />
  <title>收藏大脑</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 启动遮罩：语义模型首次加载较慢 -->
  <div id="boot" class="boot">
    <div class="boot-card">
      <div class="boot-spinner"></div>
      <div class="boot-title">收藏大脑</div>
      <div id="boot-msg" class="boot-msg">正在初始化语义模型…</div>
      <div class="boot-bar"><div id="boot-bar-fill" class="boot-bar-fill"></div></div>
    </div>
  </div>

  <header class="app-header">
    <h1 class="app-title">收藏大脑</h1>
    <div class="search-wrap">
      <input id="search" class="search-input" type="search" placeholder="语义搜索你的收藏…" autocomplete="off" />
    </div>
    <div id="filters" class="filters"></div>
    <div class="view-toggle" id="view-toggle">
      <button type="button" data-mode="folders" class="is-active">收藏夹</button>
      <button type="button" data-mode="list">全部列表</button>
    </div>
    <div class="header-actions">
      <button id="btn-qr" class="header-btn">扫码导入手机</button>
      <button id="btn-import" class="header-btn">导入 JSON</button>
      <input id="file-input" type="file" accept="application/json,.json" hidden />
    </div>
  </header>

  <main class="results" id="results"></main>

  <div id="empty" class="empty-state" hidden>
    <p>没有匹配的收藏</p>
  </div>

  <!-- 首次进入引导（区分「新用户」与「想看演示」）-->
  <div id="firstrun" class="firstrun" hidden>
    <div class="firstrun-card">
      <div class="firstrun-emoji">🧠</div>
      <h2 class="firstrun-title">欢迎使用收藏大脑</h2>
      <p class="firstrun-sub">这是你的私人收藏空间。现在它是空的 —— 下面是两种开始方式：</p>
      <button id="btn-add-mine" class="firstrun-btn primary">＋ 添加我的第一笔收藏</button>
      <button id="btn-load-demo" class="firstrun-btn ghost">浏览示例收藏（126 条演示）</button>
      <p class="firstrun-tip">提示：示例收藏仅供体验，标了「示例」标签，可随时单独删除。</p>
    </div>
  </div>

  <button id="fab" class="fab" aria-label="添加笔记">＋</button>

  <!-- 添加笔记弹层 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-mask" data-close></div>
    <div class="modal-panel">
      <div class="modal-head">
        <span>添加笔记</span>
        <button class="modal-x" data-close aria-label="关闭">×</button>
      </div>
      <form id="add-form" class="add-form">
        <label class="field">
          <span>标题</span>
          <input id="f-title" type="text" maxlength="120" placeholder="一句话概括" required />
        </label>
        <div class="field">
          <span>截图识别（可选）</span>
          <div class="img-drop" id="img-drop">
            <input id="f-image" type="file" accept="image/*" hidden />
            <div id="img-preview" class="img-preview" hidden>
              <img id="img-preview-img" alt="预览" />
              <button type="button" id="img-remove" class="img-remove" aria-label="移除">×</button>
            </div>
            <div id="img-placeholder" class="img-placeholder">
              <div class="img-ico">🖼️</div>
              <div>点击上传截图，或用手机截图后粘贴（Ctrl/⌘+V）</div>
              <button type="button" id="img-pick" class="img-pick">选择图片</button>
            </div>
          </div>
          <button type="button" id="img-recognize" class="img-recognize" hidden>🤖 AI 识别图片并自动填分类</button>
          <div class="img-rec-result" id="img-rec-result" hidden></div>
        </div>
        <label class="field">
          <span>内容 / 笔记</span>
          <textarea id="f-note" rows="4" maxlength="2000" placeholder="记下要点，保存后会自动归类"></textarea>
        </label>
        <div class="auto-cat" id="auto-cat">自动分类：分析中…</div>
        <div class="modal-actions">
          <button type="button" class="btn ghost" data-close>取消</button>
          <button type="submit" class="btn primary" id="save-btn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 扫码导入手机：选择收藏 -> 压缩 -> 生成二维码 -->
  <div id="qr-modal" class="modal" hidden>
    <div class="modal-mask" data-qr-close></div>
    <div class="modal-panel qr-panel">
      <div class="modal-head">
        <span>扫码导入手机</span>
        <button class="modal-x" data-qr-close aria-label="关闭">×</button>
      </div>
      <p class="qr-hint">勾选要发到手机的收藏（二维码容量有限，建议 ≤ 30 条），手机扫码后自动导入。</p>
      <div id="qr-list" class="qr-list"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-qr-close>取消</button>
        <button type="button" class="btn primary" id="qr-generate">生成二维码</button>
      </div>
      <div id="qr-result" class="qr-result" hidden>
        <div id="qr-img" class="qr-img"></div>
        <p class="qr-tip">用手机扫描上方二维码，或在手机浏览器打开：<a id="qr-link" href="#" target="_blank" rel="noopener"></a></p>
        <p id="qr-warn" class="qr-warn" hidden></p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- transformers.js（自托管 ESM，离线可用）-->
  <script type="module">
    try {
      const mod = await import("./lib/transformers/transformers.js");
      window.transformers = mod;
      window.dispatchEvent(new Event("transformers-ready"));
    } catch (e) {
      console.error("transformers.js 加载失败", e);
      window.dispatchEvent(new Event("transformers-ready"));
    }
  </script>

  <!-- CloudBase Web SDK（jsDelivr +esm 自动打包，浏览器可直接 import）-->
  <script type="module">
    try {
      const mod = await import("https://cdn.jsdelivr.net/npm/@cloudbase/js-sdk@2.9.0/+esm");
      window.cloudbase = mod && mod.default ? mod.default : mod;
      window.dispatchEvent(new Event("cloudbase-ready"));
    } catch (e) {
      console.warn("CloudBase SDK 加载失败，进入本地模式", e);
      window.dispatchEvent(new Event("cloudbase-ready"));
    }
  </script>
  <script src="lib/pako/pako.min.js"></script>
  <script src="lib/qrcode/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
