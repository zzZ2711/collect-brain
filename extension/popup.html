<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body { width: 280px; margin: 0; padding: 16px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1d1d1f; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p.tip { font-size: 12px; color: #86868b; line-height: 1.5; margin: 0 0 12px; }
    .count { font-size: 13px; margin: 0 0 12px; }
    .count b { color: #6d28d9; }
    button { width: 100%; height: 40px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .primary { background: #6d28d9; color: #fff; }
    .ghost { background: #f5f5f7; color: #1d1d1f; margin-top: 8px; }
    button:disabled { opacity: .5; cursor: default; }
    .step { font-size: 11px; color: #86868b; margin-top: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>小红书收藏导出</h1>
  <p class="tip">打开小红书网页版，进入「我 → 收藏」页面，等几秒让收藏加载，再点下面按钮。</p>
  <div class="count">已抓取：<b id="cnt">0</b> 条</div>
  <button id="collect" class="primary">再抓一次（页面 DOM）</button>
  <button id="export" class="ghost">导出 JSON 并导入收藏大脑</button>
  <div class="step">导出后：打开收藏大脑 → 点「导入 JSON」→ 选择下载的文件，即可语义搜索你的小红书收藏。</div>
  <script src="popup.js"></script>
</body>
</html>
